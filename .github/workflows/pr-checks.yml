# review-checks：攔下 授權聲明遺漏、誤追蹤設定與失效文件路徑。
# tests：讓既有版本一致性、前端與 Python 回歸測試確實在每次 PR 執行。
# rust-tests：準備 Linux sidecar 佔位檔，執行台灣繁體字形等 Rust 回歸測試。
name: PR checks
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  review-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: ${{ !cancelled() }}
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: 22
      - run: node scripts/review-checks/tracked-files.mjs
        if: ${{ !cancelled() }}
      - run: node scripts/review-checks/feature-map.mjs
        if: ${{ !cancelled() }}
      - name: 檢查新增依賴聲明
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: node scripts/review-checks/third-party-notices.mjs --base "origin/$BASE_REF"
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: node --test tests/frontend/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-test.txt
      - run: python -m pytest tests/python -q
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 安裝 Tauri 2 Linux 依賴
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config build-essential
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 建立測試用 sidecar 佔位檔
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/stt_engine-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/stt_engine-x86_64-unknown-linux-gnu
      # cargo test 未建置前端；建立 frontendDist 目錄供 Tauri 資源路徑檢查使用。
      - run: mkdir -p dist
      - run: cargo test --locked
        working-directory: src-tauri
